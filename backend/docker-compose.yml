version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: healthcare-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - healthcare-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - '5003:5003'
    environment:
      PORT: 5003
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/healthcare_payments
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
    depends_on:
      - mongodb
      - notification-service
    networks:
      - healthcare-net

  patient-service:
    build: ./patient-service
    container_name: patient-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/carenet_patients
      JWT_SECRET: ${JWT_SECRET}
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      DOCTOR_PRESCRIPTION_ENDPOINT_TEMPLATE: /api/doctors/prescriptions/patient/:patientUserId
    depends_on:
      - mongodb
    networks:
      - healthcare-net

  doctor-service:
    build: ./doctor-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/carenet_doctors
      JWT_SECRET: ${JWT_SECRET}
      PATIENT_SERVICE_URL: http://patient-service:3002
      APPOINTMENT_SERVICE_URL: http://appointment-service:3004
      AUTH_SERVICE_URL: http://auth-service:3001
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5003
      SYMPTOM_SERVICE_URL: http://symptom-service:3008
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:3007
    depends_on:
      - mongodb
    networks:
      - healthcare-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - '5004:5004'
    environment:
      PORT: 5004
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/healthcare_notifications
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://rabbitmq:5672
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-Healthcare Platform <noreply@yourhealthcare.com>}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - healthcare-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: healthcare-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'   # RabbitMQ port
      - '15672:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - healthcare-net

networks:
  healthcare-net:
    driver: bridge

volumes:
  mongo-data:
