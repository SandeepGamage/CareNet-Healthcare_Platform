apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: healthcare-platform/notification-service:latest
        ports:
        - containerPort: 3006
        env:
        - name: PORT
          value: "5004"
        - name: NODE_ENV
          value: "production"
        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017/healthcare_notifications"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: jwt-secret
        # Cloud-native: Use secrets for credentials
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: email-user
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: email-pass
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: twilio-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: healthcare-secrets
              key: twilio-token
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 3006
      targetPort: 3006
  type: ClusterIP
