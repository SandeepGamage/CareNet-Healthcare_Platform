version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  appointment-service:
    build: ./backend/appointment-service     # ← uses the Dockerfile inside that folder
    container_name: appointment-service
    ports:
      - "${APPOINTMENT_SERVICE_PORT}:${APPOINTMENT_SERVICE_PORT}"
    environment:
      PORT: ${APPOINTMENT_SERVICE_PORT}
      MONGO_URI: ${MONGO_URI_APPOINTMENT}
      JWT_SECRET: ${JWT_SECRET_APPOINTMENT}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # your teammates will add their services here too
  # auth-service: ...
  # patient-service: ...
  # etc.