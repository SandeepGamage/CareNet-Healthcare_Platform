version: '3.8'

services:
  # ─── Infrastructure ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: healthcare-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - healthcare-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - healthcare-network

  # ─── API Gateway ───────────────────────────────────────────────
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      APPOINTMENT_SERVICE_URL: http://appointment-service:3004
      PATIENT_SERVICE_URL: http://patient-service:3002
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:3007
      SYMPTOM_SERVICE_URL: http://symptom-service:3008
    depends_on:
      - auth-service
      - appointment-service
    networks:
      - healthcare-network

  # ─── Auth Service ──────────────────────────────────────────────
  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/carenet_auth
      JWT_SECRET: ${JWT_SECRET_APPOINTMENT:-carenet_secret}
    depends_on:
      - mongodb
    networks:
      - healthcare-network

  # ─── Appointment Service ─────────────────────────────────────────
  appointment-service:
    build: ./backend/appointment-service
    container_name: appointment-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/carenet_appointments
      JWT_SECRET: ${JWT_SECRET_APPOINTMENT:-carenet_secret}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
      - mongodb
    restart: unless-stopped
    networks:
      - healthcare-network

  # ─── Patient Service ─────────────────────────────────────────────
  patient-service:
    build: ./backend/patient-service
    container_name: patient-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/carenet_patients
      JWT_SECRET: ${JWT_SECRET_APPOINTMENT:-carenet_secret}
      DOCTOR_SERVICE_URL: http://doctor-service:3003
      DOCTOR_PRESCRIPTION_ENDPOINT_TEMPLATE: /api/doctors/prescriptions/patient/:patientUserId
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - healthcare-network





  # ─── Notification Service ───────────────────────────────────────
  notification-service:
    build: ./backend/notification-service
    container_name: notification-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      MONGO_URI: mongodb://mongodb:27017/carenet_notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - healthcare-network

  # ─── Symptom AI Service ──────────────────────────────────────────
  symptom-service:
    build: ./backend/ai-symptom-service
    container_name: symptom-service
    ports:
      - "3008:3008"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3008
      - NODE_ENV=production
      - APPOINTMENT_SERVICE_URL=http://appointment-service:3004
    restart: unless-stopped
    networks:
      - healthcare-network

  # ─── Frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carenet-frontend
    ports:
      - '5173:80'
    networks:
      - healthcare-network
    restart: unless-stopped

  # ─── Payment Service ─────────────────────────────────────────────
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      MONGO_URI: mongodb://mongodb:27017/carenet_payments
    networks:
      - healthcare-network
    depends_on:
      - mongodb
    restart: unless-stopped



networks:
  healthcare-network:
    driver: bridge

volumes:
  mongo-data:
