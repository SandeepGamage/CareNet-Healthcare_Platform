apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: MONGO_URI
              value: "mongodb+srv://hanaan:1234@cluster0.jxyoaqc.mongodb.net/notification_db?appName=Cluster0"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
            - name: EMAIL_HOST
              value: "smtp.gmail.com"
            - name: EMAIL_PORT
              value: "587"
            - name: EMAIL_SECURE
              value: "false"
            - name: EMAIL_USER
              value: "carenet.admin.support@gmail.com"
            - name: EMAIL_PASS
              value: "dunmjxijnykwlloc"
            - name: EMAIL_FROM
              value: "CareNet Healthcare <carenet.admin.support@gmail.com>"
            - name: ENABLE_SMS
              value: "true"
            - name: TEXTLK_API_TOKEN
              value: "3996|rXnzTCy0SzluVtWuvkjPTtOJAVAf2t6n0udt7pO189bbe87d"
            - name: TEXTLK_SENDER_ID
              value: "CareNet"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 3006
      targetPort: 3006
