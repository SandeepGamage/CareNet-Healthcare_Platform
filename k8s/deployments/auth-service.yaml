apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: MONGO_URI
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3006"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: JWT_SECRET
            # Supabase storage config (required when local upload fallback is disabled)
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: SUPABASE_BUCKET
              value: "user-profile"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
