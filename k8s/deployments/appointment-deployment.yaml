apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  labels:
    app: appointment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: carenet-appointment-service:1.0
          imagePullPolicy: Never # Since we are using the local minikube registry
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: RABBITMQ_URL
            - name: DOCTOR_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: DOCTOR_SERVICE_URL
            - name: PATIENT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: appointment-secret
                  key: PATIENT_SERVICE_URL
